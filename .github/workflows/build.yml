name: Build & Publish Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ayunis-legal-mcp-store
            dockerfile: store/Dockerfile
          - image: ayunis-legal-mcp
            dockerfile: mcp/Dockerfile
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/ayunis-core/${{ matrix.image }}
          tags: |
            type=raw,value=v0.1.${{ github.run_number }}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Both images share one version, so Renovate is triggered once both exist.
  trigger-infra:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Mint ayunis-infra token
        id: infra-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ayunis-core
          repositories: ayunis-infra

      - name: Trigger infra Renovate
        env:
          INFRA_TOKEN: ${{ steps.infra-token.outputs.token }}
          TAG: v0.1.${{ github.run_number }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${INFRA_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ayunis-core/ayunis-infra/dispatches \
            -d "$(jq -nc --arg tag "$TAG" '{event_type:"image-published",client_payload:{image:"ayunis-core/ayunis-legal-mcp",tag:$tag}}')"
